[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picochat"
version = "0.1.0"
description = "An honest SLM training factory with preflight, eval, and release gates."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "torch>=2.2",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
docs = [
    "pypdf>=4.0",
    "python-docx>=1.1",
]
hf = [
    "datasets>=2.20",
    "peft>=0.11",
    "safetensors>=0.4",
    "transformers>=4.40",
]
qlora = [
    "bitsandbytes>=0.43",
]
dpo = [
    "trl>=0.12",
]
monitor = [
    "tensorboard>=2.14",
]
bench = [
    "lm-eval>=0.4",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
picochat = "picochat.cli:main"
pico = "picochat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"picochat.web_assets" = [
    "*.png",
    "*.svg",
    "react/*.html",
    "react/assets/*.css",
    "react/assets/*.js",
    "react/assets/*.png",
    "react/assets/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Start with the high-signal pyflakes + syntax rules (unused imports/vars,
# undefined names, f-string mistakes). Tighten over time as the tree is cleaned.
select = ["F", "E9"]
