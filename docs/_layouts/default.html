<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}Picochat</title>
  <meta name="description" content="{{ site.description | default: 'Honest SLM training factory' }}">
  <link rel="icon" href="assets/picochat-os-symbol.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #f6f3ec;
      --shell: #fffdf8;
      --card: #ffffff;
      --soft: #f1ece2;
      --ink: #171917;
      --text: #32332f;
      --muted: #626158;
      --line: #ded5c8;
      --line-strong: #bdb0a0;
      --teal: #0d866e;
      --green: #4f9930;
      --red: #c24239;
      --amber: #ad750d;
      --blue: #345fbc;
      --shadow: rgba(46, 40, 32, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 12% 0%, rgba(13, 134, 110, 0.08), transparent 34rem),
        radial-gradient(circle at 92% 12%, rgba(52, 95, 188, 0.08), transparent 30rem),
        var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 24px 34px;
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 -8px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--shell), transparent 8%);
      box-shadow: 0 18px 52px rgba(46, 40, 32, 0.08);
      backdrop-filter: blur(18px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      color: var(--ink);
      font-weight: 760;
      text-decoration: none;
    }
    .brand-mark { width: 31px; height: 31px; }
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px 14px;
      font-size: 13px;
      font-weight: 650;
    }
    .doc {
      max-width: 950px;
      margin: 42px auto 0;
      padding: clamp(22px, 4vw, 40px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: color-mix(in srgb, var(--shell), white 48%);
      box-shadow: 0 18px 44px var(--shadow);
    }
    .doc h1 {
      margin: 0 0 18px;
      font-size: clamp(36px, 6vw, 62px);
      line-height: 1;
      letter-spacing: 0;
    }
    .doc h2 {
      margin: 38px 0 14px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    .doc h3 {
      margin: 25px 0 9px;
      font-size: 21px;
      line-height: 1.15;
    }
    .doc p,
    .doc li {
      color: var(--text);
      font-size: 15.5px;
    }
    .doc ul,
    .doc ol {
      padding-left: 24px;
    }
    .doc table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      margin: 18px 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      font-size: 14px;
    }
    .doc th,
    .doc td {
      border-bottom: 1px solid var(--line);
      padding: 10px 11px;
      vertical-align: top;
      text-align: left;
    }
    .doc tr:last-child td { border-bottom: 0; }
    .doc th {
      background: var(--soft);
      color: var(--muted);
      font-weight: 760;
      font-size: 12px;
      text-transform: uppercase;
    }
    .doc code {
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--soft);
      font-size: 0.92em;
    }
    .doc pre {
      overflow: auto;
      padding: 16px;
      border: 1px solid #22302e;
      border-radius: 16px;
      background: #111817;
      color: #f8f1df;
      font-size: 13px;
    }
    .doc pre code {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
    }
    .footer {
      margin-top: 44px;
      padding: 24px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 720px) {
      .shell { padding: 14px; }
      .nav { align-items: flex-start; flex-direction: column; }
      .nav-links { justify-content: flex-start; }
      .doc { margin-top: 28px; }
      .doc table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <nav class="nav" aria-label="Primary navigation">
      <a class="brand" href="index.html"><img class="brand-mark" src="assets/picochat-os-symbol.svg" alt=""> Picochat</a>
      <div class="nav-links">
        <a href="https://github.com/gowtham0992/picochat">GitHub</a>
        <a href="training_paths.html">Training Paths</a>
        <a href="model_evidence.html">Evidence</a>
        <a href="architecture.html">Architecture</a>
        <a href="benchmark_protocol.html">Benchmarks</a>
        <a href="model_registry.html">Registry</a>
        <a href="release_gates.html">Release Gates</a>
        <a href="deployment.html">Deploy</a>
        <a href="h100_100m_runbook.html">100M Runbook</a>
        <a href="h200_1b_runbook.html">8xH200 Runbook</a>
      </div>
    </nav>
    <main class="doc">
      {{ content }}
    </main>
    <footer class="footer">
      Picochat is MIT licensed. A completed run is not a release claim until the gates say so.
    </footer>
  </div>
</body>
</html>
