<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Picochat honest SLM factory preview</title>
  <desc id="desc">A product-style preview showing the Picochat release readiness dashboard and scale-up workflow.</desc>
  <rect width="1200" height="620" fill="#f4f0e8"/>
  <rect x="42" y="42" width="1116" height="536" fill="#fffaf1" stroke="#151515" stroke-width="4"/>
  <rect x="62" y="62" width="1076" height="64" fill="#151515"/>
  <text x="84" y="102" fill="#fffaf1" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="700">PICOCHAT WORKBENCH</text>
  <text x="874" y="100" fill="#9dd49d" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700">HONEST SLM FACTORY</text>

  <rect x="82" y="158" width="340" height="350" fill="#ffffff" stroke="#151515" stroke-width="3"/>
  <text x="106" y="194" fill="#151515" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700">FACTORY FLOW</text>
  <g font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700">
    <rect x="106" y="222" width="292" height="38" fill="#f4f0e8" stroke="#151515" stroke-width="2"/>
