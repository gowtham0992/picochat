  <rect x="452" y="158" width="666" height="350" fill="#fffaf1" stroke="#151515" stroke-width="3"/>
  <text x="478" y="194" fill="#151515" font-family="Menlo, Consolas, monospace" font-size="17" font-weight="700">RELEASE READINESS</text>
  <rect x="478" y="216" width="614" height="54" fill="#151515"/>
  <text x="500" y="250" fill="#fffaf1" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700">STATUS: WARN - 2 GATE ISSUES</text>

  <g font-family="Menlo, Consolas, monospace">
    <g>
      <rect x="478" y="296" width="188" height="72" fill="#ffffff" stroke="#151515" stroke-width="2"/>
      <text x="496" y="322" font-size="12" fill="#5d5d5d" font-weight="700">SFT FIT</text>
      <text x="496" y="350" font-size="22" fill="#2f7d32" font-weight="700">74%</text>
    </g>
    <g>
      <rect x="692" y="296" width="188" height="72" fill="#ffffff" stroke="#151515" stroke-width="2"/>
      <text x="710" y="322" font-size="12" fill="#5d5d5d" font-weight="700">TOKEN BUDGET</text>
      <text x="710" y="350" font-size="22" fill="#2f7d32" font-weight="700">1.00x</text>
    </g>
    <g>
      <rect x="904" y="296" width="188" height="72" fill="#ffffff" stroke="#151515" stroke-width="2"/>
      <text x="922" y="322" font-size="12" fill="#5d5d5d" font-weight="700">EXTERNAL</text>
      <text x="922" y="350" font-size="22" fill="#a86500" font-weight="700">NEEDED</text>
