    <polyline points="496,456 545,430 594,438 643,402 692,410 741,384 790,392 839,360 888,374 937,346 986,352 1035,332" fill="none" stroke="#234c91" stroke-width="5"/>
    <polyline points="496,474 545,462 594,450 643,442 692,438 741,428 790,420 839,416 888,410 937,406 986,402 1035,398" fill="none" stroke="#2f7d32" stroke-width="5"/>
    <text x="496" y="493" font-size="12" fill="#5d5d5d" font-weight="700">LOSS / BPB CURVES - LOWER IS BETTER</text>
