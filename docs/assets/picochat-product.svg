    <rect x="106" y="270" width="292" height="38" fill="#f4f0e8" stroke="#151515" stroke-width="2"/>
    <text x="124" y="295">TOKENIZER</text><text x="318" y="295" fill="#2f7d32">PASS</text>
    <rect x="106" y="318" width="292" height="38" fill="#f4f0e8" stroke="#151515" stroke-width="2"/>
    <text x="124" y="343">BASE TRAIN</text><text x="318" y="343" fill="#a86500">WATCH</text>
    <rect x="106" y="366" width="292" height="38" fill="#f4f0e8" stroke="#151515" stroke-width="2"/>
    <text x="124" y="391">SFT</text><text x="318" y="391" fill="#2f7d32">PASS</text>
    <rect x="106" y="414" width="292" height="38" fill="#f4f0e8" stroke="#151515" stroke-width="2"/>
    <text x="124" y="439">EVAL</text><text x="318" y="439" fill="#b42318">GATE</text>
