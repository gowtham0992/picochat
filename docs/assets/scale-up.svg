<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Picochat Scale Up preview</title>
  <desc id="desc">A stylized Scale Up command generator with setup, sanity, preflight, dry run, train, and return commands.</desc>
  <rect width="900" height="520" fill="#f4f0e8"/>
  <rect x="30" y="30" width="840" height="460" fill="#fffaf1" stroke="#151515" stroke-width="4"/>
  <text x="58" y="78" fill="#151515" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700">SCALE UP COMMANDS</text>
  <text x="58" y="106" fill="#5d5d5d" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700">GPU COMMANDS READY - RUN PREFLIGHT + DDP DRY RUN BEFORE TRAIN</text>

  <g font-family="Menlo, Consolas, monospace" font-weight="700">
    <rect x="58" y="136" width="784" height="46" fill="#151515"/>
    <text x="78" y="165" fill="#fffaf1" font-size="16">1. REMOTE SETUP</text>
    <rect x="58" y="194" width="784" height="46" fill="#151515"/>
    <text x="78" y="223" fill="#fffaf1" font-size="16">2. PRE-H100/H200 SANITY</text>
    <rect x="58" y="252" width="784" height="46" fill="#151515"/>
    <text x="78" y="281" fill="#fffaf1" font-size="16">3. CLIMBMIX IMPORT + RELEASE SKILLS PACK</text>
    <rect x="58" y="310" width="784" height="46" fill="#151515"/>
    <text x="78" y="339" fill="#9dd49d" font-size="16">4. REMOTE PREFLIGHT --preflight-only</text>
    <rect x="58" y="368" width="784" height="46" fill="#151515"/>
    <text x="78" y="397" fill="#f4c16e" font-size="16">5. REMOTE DDP DRY RUN --base-steps 100</text>
    <rect x="58" y="426" width="784" height="46" fill="#151515"/>
    <text x="78" y="455" fill="#fffaf1" font-size="16">6. FULL TRAIN + BUNDLE RETURN</text>
  </g>
</svg>
