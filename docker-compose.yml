services:
  picochat-web:
    build: .
    image: picochat:local
    ports:
      - "8765:8765"
    volumes:
      - ./runs:/workspace/runs
    environment:
      # Set a stable token; if empty the server mints one and logs it.
      PICOCHAT_AUTH_TOKEN: "${PICOCHAT_AUTH_TOKEN:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 4s
      start_period: 20s
      retries: 3
    command: ["pico", "web", "--runs-dir", "/workspace/runs", "--host", "0.0.0.0", "--port", "8765"]

  picochat-serve:
    build: .
    image: picochat:local
    profiles: ["serve"]
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/workspace/runs
    command:
      - "pico"
      - "serve"
      - "--checkpoint"
      - "${PICOCHAT_CHECKPOINT:-/workspace/runs/pico-demo/sft/checkpoint}"
      - "--tokenizer"
      - "${PICOCHAT_TOKENIZER:-/workspace/runs/pico-demo/tokenizer.json}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
